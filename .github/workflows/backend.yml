name: Backend

on:
  push:
    branches: [main, boiler-plate]
    paths: ["server/**", ".github/workflows/backend.yml"]
  pull_request:
    paths: ["server/**", ".github/workflows/backend.yml"]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v7
      - uses: erlef/setup-beam@v1
        with:
          otp-version: "28"
          elixir-version: "1.19.5"
      - run: mix deps.get
      - run: mix quality
